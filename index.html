<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>AI 隨身小秘書</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin:0; background:#fafafa; color:#1a1a1a; }
  #app { max-width:640px; margin:0 auto; padding:16px; }
  button, input { font:inherit; }
  .head { text-align:center; padding:8px 0 4px; }
  .clock { font-size:44px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
  .date { font-size:17px; color:#666; margin-top:4px; }
  .week { display:inline-block; margin-left:8px; padding:2px 10px; border-radius:6px; background:#fde8e8; font-size:14px; }
  .inputbar { display:flex; gap:8px; margin:16px 0 8px; }
  .inputbar input { flex:1; min-width:0; font-size:20px; padding:14px 16px; border-radius:12px; border:2px solid #ccc; background:#fff; }
  .inputbar input:focus { outline:none; border-color:#1a1a1a; }
  .btn { border:2px solid #ccc; background:#fff; color:#1a1a1a; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .btn:active { background:#eee; }
  .btn-icon { width:56px; height:56px; flex:none; transition: all 0.2s; }
  .btn-add { height:56px; padding:0 20px; font-size:18px; font-weight:600; background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
  .btn-listening { border-color:#d03030; color:#fff; background-color: #d03030; animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(208, 48, 48, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(208, 48, 48, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(208, 48, 48, 0); }
  }
  .status { min-height:22px; font-size:15px; color:#666; margin-bottom:8px; transition: color 0.3s;}
  .status.warning { color: #d03030; font-weight: bold; }
  .sec { margin-top:16px; }
  .sec-title { font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .sec-title .cnt { font-size:14px; color:#888; font-weight:400; }
  .empty { font-size:15px; color:#aaa; padding:12px 4px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:8px; background:#fff; }
  .row .cbx { width:28px; height:28px; flex:none; cursor:pointer; accent-color:#1a1a1a; }
  .row .body { flex:1; min-width:0; }
  .row .txt { font-size:19px; }
  .row.done .txt { text-decoration:line-through; color:#aaa; }
  .row .meta { font-size:14px; color:#777; margin-top:2px; font-variant-numeric:tabular-nums; }
  .row.due { border-color:#d03030; background:#fdeeee; animation: flash-bg 1.2s infinite; }
  .row.due .meta { color:#d03030; font-weight:600; }
  @keyframes flash-bg {
    0% { background: #fdeeee; }
    50% { background: #fdd0d0; }
    100% { background: #fdeeee; }
  }
  .row .del { opacity:0; flex:none; width:40px; height:40px; border:none; background:transparent; color:#999; cursor:pointer; border-radius:8px; align-items:center; justify-content:center; display:flex; }
  .row:hover .del, .row:focus-within .del { opacity:1; }
  .del:hover { color:#d03030; background:#f8d7d7; }
  .hint { font-size:13px; color:#999; margin-top:14px; line-height:1.7; }

  /* 停止響鈴的浮動按鈕 */
  #stopAlarmBtn {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 999;
    padding: 18px 48px;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    background: #d03030;
    border: none;
    border-radius: 50px;
    box-shadow: 0 6px 24px rgba(208, 48, 48, 0.55);
    cursor: pointer;
    animation: stopBtnPulse 1s infinite;
  }
  #stopAlarmBtn.show { display: block; }
  #stopAlarmBtn:active { background: #a02020; }
  @keyframes stopBtnPulse {
    0% { box-shadow: 0 6px 24px rgba(208, 48, 48, 0.55); }
    50% { box-shadow: 0 6px 36px rgba(208, 48, 48, 0.95); }
    100% { box-shadow: 0 6px 24px rgba(208, 48, 48, 0.55); }
  }
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小秘書">
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date"><span id="dateTxt"></span><span class="week" id="weekTxt"></span></div>
  </div>
  <div class="inputbar">
    <button class="btn btn-icon" id="micBtn" aria-label="語音輸入">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
    <input id="inp" placeholder="打字或按麥克風說話…" autocomplete="off">
    <button class="btn btn-add" id="addBtn">記下來</button>
  </div>
  <div class="status" id="status">可以這樣說：「提醒我明天早上8點吃藥」、「記得繳水費」</div>
  <div class="sec">
    <div class="sec-title">提醒事項 <span class="cnt" id="remCnt"></span></div>
    <div id="remList"></div>
  </div>
  <div class="sec">
    <div class="sec-title">備忘錄 <span class="cnt" id="noteCnt"></span></div>
    <div id="noteList"></div>
  </div>
  <div class="hint">小秘書說明：資料只保存在這台裝置上。「提醒」到時間會變紅色並發出聲音。安卓手機若無法網頁語音輸入，請直接使用鍵盤上的麥克風圖示。</div>
</div>

<button id="stopAlarmBtn">停止響鈴</button>

<script>
(function(){
  var LS_KEY='kimi_secretary_v1';
  var state={reminders:[],notes:[]};
  try{var s=JSON.parse(localStorage.getItem(LS_KEY));if(s)state=s;}catch(e){}
  
  function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
  
  var $=function(id){return document.getElementById(id);};
  
  function setStatus(s, isError){
    var el = $('status');
    el.textContent=s;
    if(isError) el.classList.add('warning');
    else el.classList.remove('warning');
  }

  var isAndroid = /Android/i.test(navigator.userAgent);

  // --- 音效引擎 ---
  var audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    } catch(e) { console.log('音訊不支援', e); }
  }

  // 播放一次警報（約 1.5 秒，高低音交替，使用方波更刺耳）
  function playAlarmBeep() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    var now = audioCtx.currentTime;
    // 高-低-高-低 交替警報，最後以長音收尾
    var notes = [
      { f: 950, t: 0.00, d: 0.18 },
      { f: 950, t: 0.22, d: 0.18 },
      { f: 700, t: 0.44, d: 0.18 },
      { f: 700, t: 0.66, d: 0.18 },
      { f: 950, t: 0.88, d: 0.18 },
      { f: 700, t: 1.10, d: 0.35 }
    ];
    
    notes.forEach(function(n) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square'; // 方波，比 sine 更響、更刺耳
      osc.frequency.setValueAtTime(n.f, now + n.t);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      gain.gain.setValueAtTime(0, now + n.t);
      gain.gain.linearRampToValueAtTime(0.6, now + n.t + 0.01);
      gain.gain.setValueAtTime(0.6, now + n.t + n.d - 0.02);
      gain.gain.linearRampToValueAtTime(0, now + n.t + n.d);
      
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.02);
    });
  }

  // --- 鬧鐘控制：重複響鈴直到使用者按停 ---
  var alarmInterval = null;
  var alarmStopTimer = null;
  var alarmActive = false;

  function startAlarm() {
    if (alarmActive) return;
    alarmActive = true;

    // 震動約 4 秒
    if ('vibrate' in navigator) {
      navigator.vibrate([500, 300, 500, 300, 500, 300, 500, 300, 500]);
    }

    // 立刻播放第一次
    playAlarmBeep();

    // 每 1.7 秒重複播放一次
    alarmInterval = setInterval(function(){
      playAlarmBeep();
      if ('vibrate' in navigator) {
        navigator.vibrate([500, 300, 500]);
      }
    }, 1700);

    // 最多響 60 秒後自動停止（避免無限吵下去）
    alarmStopTimer = setTimeout(stopAlarm, 60000);

    // 顯示停止按鈕
    $('stopAlarmBtn').classList.add('show');
  }

  function stopAlarm() {
    alarmActive = false;
    if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
    if (alarmStopTimer) { clearTimeout(alarmStopTimer); alarmStopTimer = null; }
    if ('vibrate' in navigator) navigator.vibrate(0);
    $('stopAlarmBtn').classList.remove('show');
  }

  $('stopAlarmBtn').addEventListener('click', function(){
    stopAlarm();
    setStatus('已停止響鈴。', false);
  });

  // --- 時鐘與日期 ---
  var WEEK=['日','一','二','三','四','五','六'];
  function pad(n){return String(n).padStart(2,'0');}
  function fmtDate(d){return (d.getMonth()+1)+'/'+d.getDate()+' '+WEEK[d.getDay()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
  function tick(){
    var n=new Date();
    $('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
    $('dateTxt').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';
    $('weekTxt').textContent='星期'+WEEK[n.getDay()];
    checkDue();
  }
  setInterval(tick,1000);

  // --- 解析自然語言時間 ---
  function parseTime(text){
    var n=new Date();var t=new Date(n);var m;
    if((m=text.match(/(\d+)\s*分鐘後/))){t.setMinutes(t.getMinutes()+parseInt(m[1],10));return t;}
    if((m=text.match(/半小時後/))){t.setMinutes(t.getMinutes()+30);return t;}
    if((m=text.match(/(\d+)\s*小時後/))){t.setHours(t.getHours()+parseInt(m[1],10));return t;}
    if(text.indexOf('明天')>-1)t.setDate(t.getDate()+1);
    var hour=null,min=0;
    var hm=text.match(/(\d{1,2})\s*[點:：]\s*(\d{1,2})?/);
    if(hm){hour=parseInt(hm[1],10);if(hm[2])min=parseInt(hm[2],10);}
    else if((m=text.match(/(\d{1,2})\s*點/))){hour=parseInt(m[1],10);}
    if(hour===null){
      if(/今晚|晚上/.test(text)){hour=19;min=0;}
      else if(/中午/.test(text)){hour=12;min=0;}
      else return null;
    }
    if(/下午|晚上|今晚/.test(text)&&hour<12)hour+=12;
    t.setHours(hour,min,0,0);
    if(t<n&&text.indexOf('明天')===-1)t.setDate(t.getDate()+1);
    return t;
  }
  
  function stripTimeWords(text){
    return text.replace(/(請|幫我|記得)?提醒我/g,'').replace(/(明天|今天|今晚|早上|上午|中午|下午|晚上)/g,'')
      .replace(/\d{1,2}\s*[點:：]\s*\d{0,2}\s*(分)?/g,'').replace(/\d+\s*(分鐘|小時)後/g,'').trim();
  }

  function add(text){
    text=(text||'').trim();
    if(!text)return;
    var isRem=/提醒我|記得提醒|鬧鐘/.test(text);
    if(isRem){
      var due=parseTime(text);
      var title=stripTimeWords(text)||'提醒';
      if(!due){
        setStatus('聽不太懂時間，改存到備忘錄囉', false);
        state.notes.unshift({id:Date.now(),text:text,done:false});
      }else{
        state.reminders.unshift({id:Date.now(),text:title,due:due.getTime(),done:false});
        setStatus('好的，已設定提醒：'+title+'（'+fmtDate(due)+'）', false);
        if('Notification' in window && Notification.permission==='default')Notification.requestPermission();
      }
    }else{
      state.notes.unshift({id:Date.now(),text:text.replace(/^(請|幫我)?(記下|記得|記住)/,''),done:false});
      setStatus('好的，已記在備忘錄', false);
    }
    save();render();
  }

  // --- 畫面渲染 ---
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  var DEL='<button class="del" aria-label="刪除"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></button>';
  
  function rowHTML(item,isRem){
    if(isRem){
      var diff=item.due-Date.now();
      var dueCls=(!item.done&&diff<=0)?' due':'';
      var label;
      if(item.done)label='已完成';
      else if(diff<=0)label='時間到！';
      else if(diff<3600000)label=Math.ceil(diff/60000)+' 分鐘後';
      else if(diff<86400000)label=Math.round(diff/3600000)+' 小時後 · '+fmtDate(new Date(item.due));
      else label=fmtDate(new Date(item.due));
      return '<div class="row'+dueCls+(item.done?' done':'')+'" data-id="'+item.id+'"><input type="checkbox" class="cbx" '+(item.done?'checked':'')+'><div class="body"><div class="txt">'+esc(item.text)+'</div><div class="meta">'+label+'</div></div>'+DEL+'</div>';
    }
    return '<div class="row'+(item.done?' done':'')+'" data-id="'+item.id+'"><input type="checkbox" class="cbx" '+(item.done?'checked':'')+'><div class="body"><div class="txt">'+esc(item.text)+'</div></div>'+DEL+'</div>';
  }
  
  function render(){
    var r=state.reminders,nt=state.notes;
    $('remCnt').textContent=r.length?'（未完成 '+r.filter(function(x){return !x.done}).length+'）':'';
    $('noteCnt').textContent=nt.length?'（共 '+nt.length+' 筆）':'';
    $('remList').innerHTML=r.length?r.map(function(x){return rowHTML(x,true)}).join(''):'<div class="empty">還沒有提醒。可以說：「提醒我明天早上8點吃藥」</div>';
    $('noteList').innerHTML=nt.length?nt.map(function(x){return rowHTML(x,false)}).join(''):'<div class="empty">還沒有備忘。可以說：「記得繳水費」</div>';
    
    Array.prototype.forEach.call(document.querySelectorAll('.row'),function(row){
      var id=+row.getAttribute('data-id');
      var isRem=!!row.querySelector('.meta');
      row.querySelector('.cbx').addEventListener('change',function(){
        var list=isRem?state.reminders:state.notes;
        list.forEach(function(x){if(x.id===id)x.done=!x.done;});
        save();render();
      });
      row.querySelector('.del').addEventListener('click',function(){
        state.reminders=state.reminders.filter(function(x){return x.id!==id});
        state.notes=state.notes.filter(function(x){return x.id!==id});
        save();render();setStatus('已刪除', false);
      });
    });
  }

  // --- 提醒檢查 ---
  var notified={};
  function checkDue(){
    var now=Date.now();
    state.reminders.forEach(function(x){
      if(!x.done && x.due <= now && !notified[x.id]){
        notified[x.id] = true;
        setStatus('⏰ 時間到：' + x.text, true);
        startAlarm();
        if('Notification' in window && Notification.permission === 'granted'){
          try {
            new Notification('⏰ 小秘書提醒', {
              body: x.text,
              requireInteraction: true
            });
          } catch(e){}
        }
      }
    });
    var soon=state.reminders.some(function(x){return !x.done && x.due-now < 86400000;});
    if(soon) render();
  }

  // --- 語音辨識 ---
  var rec = null;
  var listening = false;
  var isStarting = false;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  var ERR_MSG={
    'not-allowed':'麥克風權限未開啟。',
    'service-not-allowed':'系統不允許語音服務。',
    'audio-capture':'找不到麥克風，請確認沒有其他 App 正在錄音。',
    'network':'請檢查網路連線。',
    'no-speech':'沒聽到聲音，請再試一次。',
    'aborted':'語音被中斷。'
  };

  function startRecognition(){
    rec = new SR();
    rec.lang = 'zh-TW';
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    
    rec.onstart = function(){
      isStarting = false;
      listening = true;
      $('micBtn').classList.add('btn-listening');
      setStatus('請說話，我聽著呢…', false);
      $('inp').value = '';
    };
    
    rec.onend = function(){
      isStarting = false;
      listening = false;
      $('micBtn').classList.remove('btn-listening');
      var leftover = $('inp').value.trim();
      if (leftover && !$('inp').dataset.added) {
        add(leftover);
        $('inp').value = '';
      }
      $('inp').dataset.added = '';
      if($('status').textContent.indexOf('請說話') === 0){
        if (isAndroid) {
          setStatus('網頁語音未取得文字。請點擊輸入框，改用鍵盤上的麥克風輸入。', true);
        } else {
          setStatus('語音結束。', false);
        }
      }
    };
    
    rec.onerror = function(e){
      isStarting = false;
      listening = false;
      $('micBtn').classList.remove('btn-listening');
      if (isAndroid && (e.error === 'service-not-allowed' || e.error === 'aborted')) {
        setStatus('系統限制網頁語音。請點擊輸入框，改用鍵盤上的麥克風輸入。', true);
      } else {
        var errMsg = ERR_MSG[e.error] || ('發生錯誤：' + e.error);
        setStatus(errMsg, true);
      }
    };
    
    rec.onresult = function(e){
      var allTxt = '';
      var hasFinal = false;
      for (var i = 0; i < e.results.length; i++) {
        var r = e.results[i];
        if (r[0] && r[0].transcript) { allTxt += r[0].transcript; }
        if (r.isFinal) hasFinal = true;
      }
      if (allTxt) {
        $('inp').value = allTxt;
        setStatus('辨識中：' + allTxt, false);
      }
      if (hasFinal && allTxt) {
        $('inp').dataset.added = '1';
        add(allTxt);
        setTimeout(function(){
          if($('inp').value === allTxt) {
            $('inp').value = '';
            $('inp').dataset.added = '';
          }
        }, 1000);
      }
    };
    
    try {
      rec.start();
    } catch(e) {
      isStarting = false;
      $('micBtn').classList.remove('btn-listening');
      if (isAndroid) {
        setStatus('無法啟動網頁語音。請改用鍵盤上的麥克風輸入。', true);
      } else {
        setStatus('麥克風啟動失敗。', true);
      }
    }
  }

  $('micBtn').addEventListener('click', function(e){
    e.preventDefault(); 
    $('inp').blur(); 
    initAudio();
    if(!SR){ setStatus('此瀏覽器不支援網頁語音輸入，請改用鍵盤麥克風。', true); return; }
    if(listening || isStarting){ if(rec) { try { rec.stop(); } catch(err){} } return; }
    if(!navigator.onLine){ setStatus('沒有網路連線，無法使用語音。', true); return; }
    isStarting = true;
    setStatus('準備語音中...', false);
    setTimeout(function(){ startRecognition(); }, 400); 
  });

  $('addBtn').addEventListener('click',function(){
    initAudio(); 
    add($('inp').value);
    $('inp').value='';
  });
  
  $('inp').addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      initAudio();
      add($('inp').value);
      $('inp').value='';
    }
  });
  
  tick();
  render();
})();
</script>
</body>
</html>
